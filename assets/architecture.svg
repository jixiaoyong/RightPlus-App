<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6470"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6fed"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="920" height="660" fill="#f7f8fa"/>
  <text x="460" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1d2129">Right+ 架构示意图</text>
  <text x="460" y="66" text-anchor="middle" font-size="13" fill="#6b7280">非沙盒主 App + 沙盒 FinderSync 扩展 · ad-hoc 签名 · 无需开发者账号</text>

  <!-- Finder -->
  <g filter="url(#shadow)">
    <rect x="330" y="90" width="260" height="64" rx="12" fill="#ffffff" stroke="#d1d5db"/>
    <rect x="330" y="90" width="260" height="64" rx="12" fill="none" stroke="#2f6fed" stroke-width="1.5"/>
    <text x="460" y="118" text-anchor="middle" font-size="16" font-weight="600" fill="#1d2129">Finder.app</text>
    <text x="460" y="138" text-anchor="middle" font-size="12" fill="#6b7280">右键点击 → 弹出上下文菜单</text>
  </g>

  <line x1="460" y1="154" x2="460" y2="196" stroke="#5b6470" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="472" y="180" font-size="11" fill="#6b7280">FIFinderSync.menu(for:)</text>

  <!-- FinderSyncExt -->
  <g filter="url(#shadow)">
    <rect x="290" y="200" width="340" height="128" rx="12" fill="#eef4ff" stroke="#2f6fed" stroke-width="1.5"/>
    <text x="460" y="228" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">FinderSyncExt.appex</text>
    <rect x="540" y="208" width="76" height="20" rx="10" fill="#fee2e2"/>
    <text x="578" y="222" text-anchor="middle" font-size="11" fill="#b91c1c">沙盒进程</text>
    <text x="310" y="256" font-size="12.5" fill="#374151">· 读 App Group 配置,渲染两级菜单</text>
    <text x="310" y="278" font-size="12.5" fill="#374151">· 轻操作就地执行(复制路径)</text>
    <text x="310" y="300" font-size="12.5" fill="#374151">· 重操作经 IPC 转发主 App 执行</text>
    <text x="310" y="318" font-size="11" fill="#6b7280">(新建文件 / 打开方式 / 终端)</text>
  </g>

  <!-- App Group -->
  <g filter="url(#shadow)">
    <path d="M110 430 h240 a14 14 0 0 1 14 14 v130 a14 14 0 0 1 -14 14 h-240 a14 14 0 0 1 -14 -14 v-130 a14 14 0 0 1 14 -14 z" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <ellipse cx="230" cy="430" rx="127" ry="16" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="230" y="486" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">App Group 容器</text>
    <text x="230" y="508" text-anchor="middle" font-size="11.5" fill="#047857">group.io.github.jixiaoyong.rightplus</text>
    <text x="230" y="530" text-anchor="middle" font-size="12" fill="#374151">菜单配置 · 应用开关 · 钉选标记</text>
    <text x="230" y="550" text-anchor="middle" font-size="12" fill="#374151">语言偏好 (UserDefaults)</text>
  </g>

  <!-- Main App -->
  <g filter="url(#shadow)">
    <rect x="570" y="420" width="300" height="170" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="720" y="450" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">RightPlus.app 主 App</text>
    <rect x="782" y="432" width="80" height="20" rx="10" fill="#dcfce7"/>
    <text x="822" y="446" text-anchor="middle" font-size="11" fill="#15803d">非沙盒</text>
    <text x="590" y="480" font-size="12.5" fill="#374151">· SwiftUI 设置窗口(中/英)</text>
    <text x="590" y="502" font-size="12.5" fill="#374151">· 扫描常见应用 → 开关/钉选管理</text>
    <text x="590" y="524" font-size="12.5" fill="#374151">· 文件创建(docx 等内置模板)</text>
    <text x="590" y="546" font-size="12.5" fill="#374151">· NSWorkspace 拉起应用 / 终端</text>
    <text x="590" y="568" font-size="11" fill="#6b7280">ad-hoc 签名 · 菜单栏常驻(可隐藏)</text>
  </g>

  <!-- Ext <-> AppGroup -->
  <line x1="300" y1="328" x2="245" y2="428" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="262" y1="420" x2="318" y2="332" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="150" y="382" font-size="11.5" fill="#047857">UserDefaults(suiteName:) 读配置</text>

  <!-- MainApp <-> AppGroup -->
  <line x1="586" y1="500" x2="372" y2="498" stroke="#10b981" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="392" y="490" font-size="11.5" fill="#047857">写入配置</text>

  <!-- Ext <-> MainApp TCP -->
  <path d="M600 320 C 700 350, 730 380, 724 416" fill="none" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
  <text x="652" y="368" font-size="12" font-weight="600" fill="#2f6fed">本地 TCP 命令转发</text>
  <text x="652" y="386" font-size="11" fill="#6b7280">127.0.0.1 固定端口 · 新建/打开/终端</text>

  <!-- Footer note -->
  <rect x="110" y="606" width="700" height="34" rx="8" fill="#fef9c3"/>
  <text x="460" y="628" text-anchor="middle" font-size="12.5" fill="#713f12">全部组件使用 ad-hoc 签名(codesign --sign -)构建安装 —— 无证书、无描述文件、永不过期</text>
</svg>
